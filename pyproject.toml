[project]
name = "ai-interview-bot"
version = "1.0.0"
description = "Real-time AI voice interviewer that questions candidates on their resume and grades the interview"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, async pitfalls
select = ["F", "E", "W", "I", "B", "UP", "SIM", "ASYNC"]
# FastAPI's Depends()/Form() defaults are the framework's intended pattern.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "tests"]
# The alembic/ migrations folder would otherwise make isort treat the library as local.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:pkg_resources is deprecated:UserWarning",
]
